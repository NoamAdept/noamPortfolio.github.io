<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 864" width="1152" height="864" role="img" aria-labelledby="t d">
  <title id="t">Still Reachable: a memory leak climbs until the OOM killer strikes</title>
  <desc id="d">A memory usage graph with a sawtooth line. Each garbage collection drops memory, but the floor rises every cycle until the line hits the dashed memory.max limit, where a red tag reads exit 137, OOMKilled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="line" x1="236" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3dbf72"/>
      <stop offset="0.55" stop-color="#fdb44e"/>
      <stop offset="1" stop-color="#ef4f5a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="250" x2="0" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4f5a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fdb44e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3dbf72" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1152" height="864" fill="url(#bg)"/>

  <g font-family="Menlo, 'SF Mono', ui-monospace, Consolas, monospace">
    <!-- card -->
    <rect x="176" y="150" width="800" height="564" rx="28" fill="#fff" filter="url(#soft)"/>

    <!-- axes -->
    <path d="M236 200 V660 H916" fill="none" stroke="#c9ced8" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="214" font-size="26" fill="#8a909c">RSS</text>
    <text x="916" y="696" font-size="24" fill="#8a909c" text-anchor="end">time →</text>

    <!-- memory.max limit -->
    <path d="M236 250 H916" stroke="#ef4f5a" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>
    <text x="252" y="288" font-size="24" fill="#d93645" font-weight="600">memory.max</text>

    <!-- sawtooth: each GC drops it, the floor keeps rising -->
    <path d="M236 640 L300 560 L316 620 L380 530 L396 595 L460 500 L476 565 L540 465 L556 535 L620 430 L636 505 L700 395 L716 470 L780 355 L796 435 L870 262 L870 660 L236 660 Z"
          fill="url(#area)"/>
    <path d="M236 640 L316 620 L396 595 L476 565 L556 535 L636 505 L716 470 L796 435"
          fill="none" stroke="#9f6bd6" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
    <path d="M236 640 L300 560 L316 620 L380 530 L396 595 L460 500 L476 565 L540 465 L556 535 L620 430 L636 505 L700 395 L716 470 L780 355 L796 435 L870 254"
          fill="none" stroke="url(#line)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- impact -->
    <circle cx="870" cy="252" r="20" fill="#ff5a64" filter="url(#glow)"/>
    <circle cx="870" cy="252" r="9" fill="#fff"/>

    <!-- OOM tag -->
    <g transform="rotate(-6 930 128)" filter="url(#soft)">
      <rect x="826" y="64" width="232" height="128" rx="18" fill="#ef4f5a"/>
      <text x="942" y="136" font-size="60" font-weight="700" fill="#fff" text-anchor="middle">137</text>
      <text x="942" y="172" font-size="22" fill="#ffe1e3" text-anchor="middle">OOMKilled</text>
    </g>
  </g>
</svg>

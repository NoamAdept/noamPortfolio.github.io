<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="838" height="358" rx="14" fill="#f7f9fb" stroke="#e2e7ec"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#16202b">Why the laptop saw nothing on the console</text>
  <text x="32" y="66" font-size="14" fill="#5c6773">A tiny "translator" chip turns the device's internal signals into something USB understands. Where it lives decides whether a port appears.</text>

  <!-- Row 1: works -->
  <rect x="32" y="92" width="776" height="100" rx="11" fill="#eafaf0" stroke="#9fd8b4"/>
  <text x="50" y="120" font-size="14" font-weight="700" fill="#16202b">Network switches</text>
  <rect x="50" y="130" width="120" height="46" rx="8" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="110" y="151" font-size="12.5" fill="#16202b" text-anchor="middle">device with</text>
  <text x="110" y="167" font-size="12.5" fill="#16202b" text-anchor="middle">chip inside</text>
  <line x1="170" y1="153" x2="300" y2="153" stroke="#4a5563" stroke-width="3"/>
  <text x="235" y="145" font-size="12" fill="#5c6773" text-anchor="middle">plain cable</text>
  <rect x="300" y="130" width="120" height="46" rx="8" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="360" y="157" font-size="12.5" fill="#16202b" text-anchor="middle">laptop</text>
  <text x="470" y="158" font-size="14" font-weight="700" fill="#1a8a4a">&#10003; a port appears</text>

  <!-- Row 2: fails -->
  <rect x="32" y="206" width="776" height="118" rx="11" fill="#fdecec" stroke="#f0b4b4"/>
  <text x="50" y="234" font-size="14" font-weight="700" fill="#16202b">Many access points (this AP)</text>
  <rect x="50" y="244" width="120" height="46" rx="8" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="110" y="265" font-size="12.5" fill="#16202b" text-anchor="middle">raw signals,</text>
  <text x="110" y="281" font-size="12.5" fill="#16202b" text-anchor="middle">no chip</text>
  <line x1="170" y1="267" x2="300" y2="267" stroke="#4a5563" stroke-width="3"/>
  <text x="235" y="259" font-size="12" fill="#5c6773" text-anchor="middle">plain cable</text>
  <rect x="300" y="244" width="120" height="46" rx="8" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="360" y="271" font-size="12.5" fill="#16202b" text-anchor="middle">laptop</text>
  <text x="470" y="263" font-size="14" font-weight="700" fill="#c0392b">&#10007; nothing appears</text>
  <text x="470" y="286" font-size="12.5" fill="#5c6773">fix: a special adapter with the chip built into the cable</text>

  <text x="32" y="348" font-size="13" fill="#5c6773">&#8230; and the chip only wakes up when the access point itself has power.</text>
</svg>

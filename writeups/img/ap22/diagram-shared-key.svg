<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="838" height="358" rx="14" fill="#f7f9fb" stroke="#e2e7ec"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#16202b">The shared-key problem</text>
  <text x="32" y="66" font-size="14" fill="#5c6773">The secret key that locks the admin page was baked into the firmware , so every device shipped with the same one.</text>

  <!-- key glyph def -->
  <g id="k" transform="translate(0,0)"></g>

  <!-- firmware source -->
  <rect x="40" y="110" width="150" height="150" rx="12" fill="#e8f1fc" stroke="#9cc4f0"/>
  <text x="115" y="140" font-size="14" font-weight="700" fill="#16202b" text-anchor="middle">Firmware</text>
  <!-- key -->
  <circle cx="98" cy="185" r="16" fill="none" stroke="#e0a200" stroke-width="5"/>
  <rect x="112" y="181" width="44" height="8" fill="#e0a200"/>
  <rect x="146" y="189" width="8" height="12" fill="#e0a200"/>
  <rect x="132" y="189" width="8" height="10" fill="#e0a200"/>
  <text x="115" y="235" font-size="12.5" fill="#5c6773" text-anchor="middle">one secret key</text>

  <!-- three APs with same key -->
  <g>
    <rect x="300" y="96" width="150" height="58" rx="10" fill="#ffffff" stroke="#cfd8e2"/>
    <text x="340" y="131" font-size="13" fill="#16202b">AP #1</text>
    <circle cx="415" cy="125" r="9" fill="none" stroke="#e0a200" stroke-width="3.5"/><rect x="423" y="122" width="20" height="5" fill="#e0a200"/>
    <rect x="300" y="166" width="150" height="58" rx="10" fill="#ffffff" stroke="#cfd8e2"/>
    <text x="340" y="201" font-size="13" fill="#16202b">AP #2</text>
    <circle cx="415" cy="195" r="9" fill="none" stroke="#e0a200" stroke-width="3.5"/><rect x="423" y="192" width="20" height="5" fill="#e0a200"/>
    <rect x="300" y="236" width="150" height="58" rx="10" fill="#ffffff" stroke="#cfd8e2"/>
    <text x="340" y="271" font-size="13" fill="#16202b">AP #3</text>
    <circle cx="415" cy="265" r="9" fill="none" stroke="#e0a200" stroke-width="3.5"/><rect x="423" y="262" width="20" height="5" fill="#e0a200"/>
  </g>
  <line x1="190" y1="170" x2="300" y2="125" stroke="#9cc4f0" stroke-width="2.5"/>
  <line x1="190" y1="185" x2="300" y2="195" stroke="#9cc4f0" stroke-width="2.5"/>
  <line x1="190" y1="200" x2="300" y2="265" stroke="#9cc4f0" stroke-width="2.5"/>
  <text x="375" y="315" font-size="12.5" fill="#5c6773" text-anchor="middle">every unit gets the identical key</text>

  <!-- attacker -->
  <rect x="560" y="150" width="240" height="96" rx="12" fill="#fdecec" stroke="#f0b4b4"/>
  <text x="680" y="182" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Anyone with that key</text>
  <text x="680" y="206" font-size="12.5" fill="#5c6773" text-anchor="middle">can unlock the "secure" admin</text>
  <text x="680" y="224" font-size="12.5" fill="#5c6773" text-anchor="middle">page on any of these devices</text>
  <line x1="450" y1="195" x2="560" y2="198" stroke="#f0b4b4" stroke-width="2.5" stroke-dasharray="5 4"/>

  <text x="32" y="344" font-size="13.5" fill="#5c6773">Plain English: like every house on the street being shipped with the same front-door key.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="838" height="298" rx="14" fill="#f7f9fb" stroke="#e2e7ec"/>
  <text x="32" y="44" font-size="21" font-weight="700" fill="#16202b">One cable, two jobs: Power over Ethernet (PoE)</text>

  <!-- Switch -->
  <rect x="40" y="96" width="200" height="120" rx="12" fill="#ffffff" stroke="#cfd8e2"/>
  <rect x="64" y="176" width="152" height="18" rx="4" fill="#eef2f6" stroke="#d7dee6"/>
  <rect x="78" y="180" width="10" height="10" rx="2" fill="#aab6c2"/>
  <rect x="98" y="180" width="10" height="10" rx="2" fill="#aab6c2"/>
  <rect x="118" y="180" width="10" height="10" rx="2" fill="#aab6c2"/>
  <text x="140" y="130" font-size="15" font-weight="600" fill="#16202b" text-anchor="middle">Network switch</text>
  <text x="140" y="152" font-size="13" fill="#5c6773" text-anchor="middle">(or PoE injector)</text>

  <!-- AP -->
  <rect x="600" y="92" width="200" height="128" rx="34" fill="#ffffff" stroke="#cfd8e2"/>
  <circle cx="700" cy="156" r="30" fill="#f0f4f8" stroke="#d7dee6"/>
  <circle cx="700" cy="156" r="9" fill="#cdd7e1"/>
  <text x="700" y="126" font-size="15" font-weight="600" fill="#16202b" text-anchor="middle">AP22</text>

  <!-- Cable -->
  <line x1="240" y1="156" x2="600" y2="156" stroke="#0073EA" stroke-width="8" stroke-linecap="round"/>
  <text x="420" y="138" font-size="14" fill="#0073EA" font-weight="600" text-anchor="middle">&#8594; your internet data</text>
  <text x="420" y="188" font-size="14" fill="#0073EA" font-weight="600" text-anchor="middle">&#8594; electricity (~48 V)</text>

  <text x="420" y="258" font-size="14" fill="#5c6773" text-anchor="middle">The same Ethernet cable carries both, so the access point needs no separate power brick.</text>
</svg>

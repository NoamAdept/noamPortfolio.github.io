<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="838" height="498" rx="14" fill="#f7f9fb" stroke="#e2e7ec"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#16202b">A firmware image is a set of nested boxes</text>
  <text x="32" y="66" font-size="14" fill="#5c6773">Each layer wraps the next. You "peel" one at a time with a standard tool: the right column.</text>

  <!-- nested bars, each indented to suggest nesting -->
  <!-- L1 -->
  <rect x="32" y="88" width="470" height="54" rx="9" fill="#e8f1fc" stroke="#9cc4f0"/>
  <text x="50" y="112" font-size="14" font-weight="700" fill="#16202b">Firmware file</text>
  <text x="50" y="131" font-size="12.5" fill="#5c6773">one big downloaded blob</text>
  <text x="560" y="119" font-size="13" fill="#0073EA" font-weight="600">binwalk: look inside</text>

  <!-- L2 -->
  <rect x="70" y="150" width="432" height="48" rx="9" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="88" y="170" font-size="13.5" font-weight="700" fill="#16202b">Vendor header + digital signature</text>
  <text x="88" y="188" font-size="12.5" fill="#5c6773">512 bytes that prove it's genuine</text>
  <text x="560" y="179" font-size="13" fill="#0073EA" font-weight="600">dd: cut it off</text>

  <!-- L3 -->
  <rect x="104" y="206" width="398" height="46" rx="9" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="122" y="226" font-size="13.5" font-weight="700" fill="#16202b">uImage</text>
  <text x="122" y="243" font-size="12.5" fill="#5c6773">a standard wrapper around the kernel</text>

  <!-- L4 -->
  <rect x="138" y="260" width="364" height="48" rx="9" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="156" y="280" font-size="13.5" font-weight="700" fill="#16202b">Linux kernel &#183; compressed (LZMA)</text>
  <text x="156" y="298" font-size="12.5" fill="#5c6773">the operating system core</text>
  <text x="560" y="289" font-size="13" fill="#0073EA" font-weight="600">lzma: decompress</text>

  <!-- L5 -->
  <rect x="172" y="316" width="330" height="48" rx="9" fill="#ffffff" stroke="#cfd8e2"/>
  <text x="190" y="336" font-size="13.5" font-weight="700" fill="#16202b">Root filesystem &#183; compressed (LZMA)</text>
  <text x="190" y="354" font-size="12.5" fill="#5c6773">~38 MB: everything the device runs</text>
  <text x="560" y="345" font-size="13" fill="#0073EA" font-weight="600">lzma: decompress</text>

  <!-- L6 -->
  <rect x="206" y="372" width="296" height="54" rx="9" fill="#eafaf0" stroke="#9fd8b4"/>
  <text x="224" y="394" font-size="13.5" font-weight="700" fill="#16202b">992 real files</text>
  <text x="224" y="412" font-size="12.5" fill="#5c6773">/etc, /sbin, the web interface, keys&#8230;</text>
  <text x="560" y="403" font-size="13" fill="#0073EA" font-weight="600">tar: unpack</text>

  <text x="32" y="470" font-size="13.5" fill="#5c6773">Plain English: like a zip inside a zip inside a zip. The trick is knowing which tool opens each kind.</text>
</svg>
